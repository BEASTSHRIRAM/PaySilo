services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: paysilo
      POSTGRES_USER: paysilo
      # Local dev only. Set POSTGRES_PASSWORD in your .env (see .env.example);
      # compose refuses to start without it. Never commit a real password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paysilo -d paysilo"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # The bundled Postgres; remove this line to use DATABASE_URL from .env (e.g. Supabase).
      DATABASE_URL: postgresql://paysilo:${POSTGRES_PASSWORD}@postgres:5432/paysilo
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The Next.js server proxies /api/* to the backend (resolved at build time).
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
