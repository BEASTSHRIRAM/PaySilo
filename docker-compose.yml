services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: paysilo
      POSTGRES_USER: paysilo
      POSTGRES_PASSWORD: paysilo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-demo}
      AIRWALLEX_CLIENT_ID: ${AIRWALLEX_CLIENT_ID:-}
      AIRWALLEX_API_KEY: ${AIRWALLEX_API_KEY:-}
      AIRWALLEX_BASE_URL: ${AIRWALLEX_BASE_URL:-https://api-demo.airwallex.com/api/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: postgresql://paysilo:paysilo@postgres:5432/paysilo
      METAL_RPC_URL: ${METAL_RPC_URL:-}
      METAL_PRIVATE_KEY: ${METAL_PRIVATE_KEY:-}
      METAL_REGISTRY_ADDRESS: ${METAL_REGISTRY_ADDRESS:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
