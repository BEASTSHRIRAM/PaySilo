[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-python-minimal"
version = "0.1.0"
description = "Minimal AgentCore Runtime HTTP agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore >= 1.18.1, < 2.0.0",
    "botocore[crt] ~= 1.43.0",
    "aws-opentelemetry-distro ~= 0.21.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "eth-account>=0.14.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.7",
    "langchain-core>=1.7.1",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
